name: Weekly report

# Monday 07:00 UTC, which is 07:00 in Lisbon in winter and 08:00 in summer:
# asks the app to email last week's numbers to every owner who switched the
# report on. The app records what it sent, so a re-run sends nothing twice.
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the app to send the weekly reports
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET is not set; skipping."; exit 0; fi
          curl --fail-with-body -sS -X POST \
            -H "x-cron-secret: $CRON_SECRET" \
            https://rest-finance.bruno-dev.xyz/api/cron/weekly-report
