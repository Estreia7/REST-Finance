# /etc/nginx/sites-available/rest-finance.bruno-dev.xyz
#
# Versioned here because the server is otherwise the only copy of this config.
# After editing: copy to the VPS, `nginx -t`, then `systemctl reload nginx`.
#
# NOTE: this subdomain previously pointed at AlumAI (port 3004). Repointing it
# to 3008 is what moves rest-finance.bruno-dev.xyz to this app.

server {
    listen 80;
    listen [::]:80;
    server_name rest-finance.bruno-dev.xyz;

    # Certbot writes its challenge here; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rest-finance.bruno-dev.xyz;

    ssl_certificate     /etc/letsencrypt/live/rest-finance.bruno-dev.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rest-finance.bruno-dev.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS. The app also sets security headers in next.config.mjs; this is the
    # edge-level backstop in case the Node process is bypassed or down.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Invoice photos and compliance PDFs are posted through the app.
    client_max_body_size 12M;

    # Compliance documents are served ONLY through the authenticated route
    # handler, which re-checks ownership. Never expose the storage directory.
    location /storage/ {
        deny all;
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    # Next.js fingerprints these filenames, so they are safe to cache hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3008;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
